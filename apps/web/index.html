<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfdfe" />
    <link rel="stylesheet" href="/src/app/startup.css" />
    <script>
      (() => {
        let selected;
        try {
          selected = localStorage.getItem('zwoa-color-theme');
        } catch {
          // 存储不可用时使用系统配色。
        }
        const dark = selected === 'dark' ||
          (selected !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#16181e' : '#fdfdfe';
      })();
    </script>
    <title>中网联合 OA / CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
